name: Test all versions

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Node ${{ matrix.node-version }} / marked ${{ matrix.marked-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest version here should also be in `engines` field
        node-version: ['22.12', 'lts/*', 'latest']
        marked-version: ['13', '14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install marked ${{ matrix.marked-version }}
        run: pnpm add -D marked@${{ matrix.marked-version }}
      - name: Run unittests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CommonJS bundle
        run: pnpm run build
      - name: Smoke test CommonJS bundle
        run: node -e "const {marked}=require('marked'); const {markedTerminal}=require('./index.cjs'); marked.use(markedTerminal()); if (!marked.parse('# hi').includes('hi')) process.exit(1)"
