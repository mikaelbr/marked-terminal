name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke test packed package (import and require)
        run: |
          pnpm pack --out package.tgz
          mkdir -p ../smoke && cd ../smoke
          npm init -y > /dev/null
          npm install ../${{ github.event.repository.name }}/package.tgz marked
          node --input-type=module -e "import {marked} from 'marked'; import {markedTerminal} from 'marked-terminal'; marked.use(markedTerminal()); if (!marked.parse('# hi').includes('hi')) process.exit(1)"
          node -e "const {marked}=require('marked'); const {markedTerminal}=require('marked-terminal'); marked.use(markedTerminal()); if (!marked.parse('# hi').includes('hi')) process.exit(1)"

  test:
    name: Node ${{ matrix.node-version }} / marked ${{ matrix.marked-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest version here should also be in `engines` field.
        # Not "latest": it resolves to Node 27 prereleases, where pngjs (via
        # terminal-image/jimp) breaks on zlib.Inflate being an ES class.
        node-version: ["22.12", "lts/*", "26"]
        marked-version: ["13", "14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install marked ${{ matrix.marked-version }}
        run: pnpm add -D marked@${{ matrix.marked-version }}
      # Type tests run in the check job against the latest marked types.
      - run: pnpm test --typecheck.enabled=false
